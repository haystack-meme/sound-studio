<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Studio</title>
<style>
  :root {
    --bg:#121417; --panel:#1b1e23; --panel2:#22262c; --line:#2e333a; --text:#e7e9ec; --dim:#8b929c;
    --accent:#ffb547; --accent2:#5cc8ff; --good:#5fd38d; --bad:#ff6b6b;
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; }
  button:hover { border-color:#4a515b; }
  button.primary { background:var(--accent); color:#1a1205; border-color:var(--accent); font-weight:700; }
  button.small { padding:3px 8px; font-size:12px; }
  button.icon { padding:3px 7px; }
  select { background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }

  .app { display:grid; grid-template-columns:230px 1fr 420px; grid-template-rows:56px 1fr; height:100vh; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0 12px 0 0; letter-spacing:.3px; }
  header h1 span { color:var(--accent); }
  #play { font-size:15px; padding:7px 20px; }
  header label { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; }
  header .spacer { flex:1; }
  .kbd { font-family:var(--mono); font-size:11px; padding:1px 5px; border:1px solid var(--line); border-radius:4px; color:var(--dim); }

  aside { border-right:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px; }
  aside h2, .right h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:14px 0 6px; }
  aside h2:first-child { margin-top:0; }
  .preset { display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .preset:hover { background:var(--panel2); }
  .preset.on { background:#2b2414; color:var(--accent); }
  .preset .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .preset button { opacity:0; }
  .preset:hover button { opacity:1; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }

  main { overflow:auto; padding:14px 16px 40px; }
  .master { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px 18px; background:var(--panel); border:1px solid var(--line);
            border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .master .title { grid-column:1/-1; display:flex; align-items:center; gap:10px; }
  .master .title input { flex:1; background:transparent; border:0; border-bottom:1px dashed var(--line); font-size:17px; font-weight:600; padding:2px 0; }
  .layer { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; }
  .layer.off { opacity:.5; }
  .layer > .head { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .layer > .head .lname { font-weight:700; }
  .layer > .head .grow { flex:1; }
  .groups { display:grid; grid-template-columns:repeat(4, 1fr); gap:0; }
  .group { padding:10px 12px 12px; border-right:1px solid var(--line); }
  .group:last-child { border-right:0; }
  .group h3 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--accent2); margin:0 0 8px; font-weight:600; }
  .param { margin-bottom:9px; }
  .param .top { display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--dim); }
  .param .val { font-family:var(--mono); color:var(--text); background:transparent; border:0; width:74px; text-align:right; font-size:12px; padding:0; }
  .param .val:focus { outline:1px solid var(--accent); border-radius:3px; }
  .param input[type=range] { width:100%; margin:3px 0 0; accent-color:var(--accent); }
  .param.check { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--dim); }
  .param select { width:100%; margin-top:3px; }
  .hint { color:var(--dim); font-size:12px; }

  .right { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; }
  canvas { width:100%; display:block; background:#0c0d0f; border:1px solid var(--line); border-radius:8px; }
  #wave { height:120px; }
  #spec { height:190px; margin-top:8px; }
  .stats { display:flex; gap:14px; font-family:var(--mono); font-size:12px; color:var(--dim); margin:6px 0 0; }
  .stats b { color:var(--text); font-weight:500; }
  textarea { width:100%; height:200px; background:#0c0d0f; border:1px solid var(--line); border-radius:8px;
             font-family:var(--mono); font-size:11.5px; padding:8px; resize:vertical; white-space:pre; }
  .tabs { display:flex; gap:4px; margin-bottom:6px; }
  .tabs button.on { border-color:var(--accent); color:var(--accent); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2b2414; color:var(--accent);
           border:1px solid var(--accent); padding:7px 14px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  .narrow { display:none; padding:40px; text-align:center; color:var(--dim); }
  @media (max-width: 1100px) {
    .app { grid-template-columns:200px 1fr; }
    .right { grid-column:1/-1; border-left:0; border-top:1px solid var(--line); }
    .app { height:auto; grid-template-rows:56px auto auto; }
    .groups { grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sound <span>Studio</span></h1>
    <button id="play" class="primary">▶ Play</button>
    <span class="kbd">Space</span>
    <label><input type="checkbox" id="autoplay" checked> Play on change</label>
    <label><input type="checkbox" id="sequence"> Play 3 in a row</label>
    <label><input type="checkbox" id="randomize" checked> Randomize</label>
    <div class="spacer"></div>
    <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
  </header>

  <aside>
    <h2>Built-in presets</h2>
    <div id="builtins"></div>
    <h2>My sounds</h2>
    <div id="mine"></div>
    <div class="row" style="margin-top:8px">
      <button id="save" class="small">Save</button>
      <button id="saveAs" class="small">Save as…</button>
      <button id="newSound" class="small">New</button>
    </div>
    <p class="hint">Saved in this browser only.</p>
  </aside>

  <main>
    <div class="master" id="master"></div>
    <div id="layers"></div>
    <button id="addLayer">+ Add layer</button>
  </main>

  <section class="right">
    <h2>Waveform</h2>
    <canvas id="wave"></canvas>
    <h2>Spectrogram</h2>
    <canvas id="spec"></canvas>
    <div class="stats"><span>length <b id="stLen">–</b></span><span>peak <b id="stPeak">–</b></span><span>centre <b id="stCentre">–</b></span></div>

    <h2>Export</h2>
    <div class="row">
      <button id="wav">Download .wav</button>
      <button id="copyCode">Copy code</button>
      <button id="copyJson">Copy JSON</button>
      <button id="importJson">Import JSON</button>
    </div>
    <div class="tabs" style="margin-top:10px">
      <button id="tabCode" class="small on">JavaScript</button>
      <button id="tabJson" class="small">JSON</button>
    </div>
    <textarea id="out" spellcheck="false"></textarea>
    <p class="hint">The JavaScript is a self-contained <code>playSound(ctx, destination)</code> function using only the Web Audio API. Import: paste JSON in the box, then press Import JSON.</p>
  </section>
</div>
<div id="toast"></div>

<script>
// ===================== model =====================
const SOURCES = ['pink', 'white', 'brown', 'sine', 'triangle', 'square', 'sawtooth'];
const isNoise = s => s === 'pink' || s === 'white' || s === 'brown';

// Layer parameters: grouped for the UI. log = logarithmic slider (frequencies).
const LAYER_PARAMS = [
  { group: 'Source', items: [
    { key: 'source', label: 'Source', type: 'select', options: SOURCES },
    { key: 'gain', label: 'Level', min: 0, max: 1, step: 0.01, unit: '' },
    { key: 'delay', label: 'Start delay', min: 0, max: 1000, step: 1, unit: 'ms' },
  ]},
  { group: 'Pitch / sweep', items: [
    { key: 'freqStart', label: 'Start', min: 40, max: 12000, step: 1, unit: 'Hz', log: true },
    { key: 'freqEnd', label: 'End', min: 40, max: 12000, step: 1, unit: 'Hz', log: true },
    { key: 'rise', label: 'Sweep strength', min: 0, max: 4, step: 0.05, unit: '×' },
    { key: 'sweepCurve', label: 'Curve', type: 'select', options: ['exponential', 'linear'] },
  ]},
  { group: 'Filters', items: [
    { key: 'bandpass', label: 'Band-pass follows sweep', type: 'check' },
    { key: 'q', label: 'Band-pass width (Q)', min: 0.1, max: 20, step: 0.05, unit: '', log: true },
    { key: 'highpass', label: 'Low cut', min: 20, max: 8000, step: 1, unit: 'Hz', log: true },
    { key: 'lowpass', label: 'High cut', min: 200, max: 20000, step: 1, unit: 'Hz', log: true },
    { key: 'lowpassStages', label: 'High-cut steepness', min: 1, max: 4, step: 1, unit: '' },
  ]},
  { group: 'Envelope', items: [
    { key: 'attack', label: 'Attack', min: 0, max: 1000, step: 1, unit: 'ms' },
    { key: 'hold', label: 'Hold', min: 0, max: 1000, step: 1, unit: 'ms' },
    { key: 'release', label: 'Release', min: 1, max: 3000, step: 1, unit: 'ms' },
    { key: 'envCurve', label: 'Shape', type: 'select', options: ['linear', 'eased', 'exponential'] },
    { key: 'pitchVar', label: 'Random pitch ±', min: 0, max: 30, step: 0.5, unit: '%' },
    { key: 'gainVar', label: 'Random level ±', min: 0, max: 50, step: 1, unit: '%' },
  ]},
];
const MASTER_PARAMS = [
  { key: 'volume', label: 'Volume', min: 0, max: 1, step: 0.01, unit: '' },
  { key: 'timeScale', label: 'Length scale', min: 0.1, max: 4, step: 0.01, unit: '×' },
  { key: 'seqGap', label: 'Gap (3 in a row)', min: 50, max: 1500, step: 10, unit: 'ms' },
  { key: 'reverb', label: 'Room', min: 0, max: 1, step: 0.01, unit: '' },
];

const defaultLayer = () => ({
  enabled: true, source: 'pink', gain: 0.5, delay: 0,
  freqStart: 1000, freqEnd: 1400, rise: 1, sweepCurve: 'exponential',
  bandpass: true, q: 1, highpass: 300, lowpass: 6000, lowpassStages: 1,
  attack: 20, hold: 20, release: 120, envCurve: 'linear', pitchVar: 5, gainVar: 10,
});
const defaultSound = () => ({ name: 'Untitled', volume: 0.7, timeScale: 1, seqGap: 280, reverb: 0, layers: [defaultLayer()] });

const BUILTINS = [
  { name: 'Solitaire — Soft tap (current)', volume: 0.7, timeScale: 1, seqGap: 280, reverb: 0, layers: [
    { enabled: true, source: 'white', gain: 0.5, delay: 0, freqStart: 1440, freqEnd: 1440, rise: 1, sweepCurve: 'exponential',
      bandpass: true, q: 0.8, highpass: 20, lowpass: 2500, lowpassStages: 1,
      attack: 4, hold: 0, release: 28, envCurve: 'exponential', pitchVar: 0, gainVar: 0 },
    { enabled: true, source: 'sine', gain: 0.25, delay: 0, freqStart: 600, freqEnd: 420, rise: 1, sweepCurve: 'exponential',
      bandpass: false, q: 1, highpass: 20, lowpass: 20000, lowpassStages: 1,
      attack: 4, hold: 0, release: 18, envCurve: 'exponential', pitchVar: 0, gainVar: 0 } ] },
  { name: 'Feather', volume: 0.7, timeScale: 1, seqGap: 280, reverb: 0, layers: [
    { enabled: true, source: 'pink', gain: 0.6, delay: 0, freqStart: 3500, freqEnd: 2200, rise: 1, sweepCurve: 'exponential',
      bandpass: true, q: 0.5, highpass: 1500, lowpass: 20000, lowpassStages: 1,
      attack: 25, hold: 0, release: 100, envCurve: 'exponential', pitchVar: 10, gainVar: 0 } ] },
  { name: 'Soft pluck (win note)', volume: 0.7, timeScale: 1, seqGap: 130, reverb: 0, layers: [
    { enabled: true, source: 'triangle', gain: 0.7, delay: 0, freqStart: 330, freqEnd: 330, rise: 1, sweepCurve: 'exponential',
      bandpass: false, q: 1, highpass: 20, lowpass: 1100, lowpassStages: 1,
      attack: 4, hold: 0, release: 450, envCurve: 'exponential', pitchVar: 0, gainVar: 0 } ] },
  { name: 'Bubble pop', volume: 0.7, timeScale: 1, seqGap: 250, reverb: 0, layers: [
    { enabled: true, source: 'sine', gain: 0.6, delay: 0, freqStart: 500, freqEnd: 800, rise: 1, sweepCurve: 'exponential',
      bandpass: false, q: 1, highpass: 20, lowpass: 20000, lowpassStages: 1,
      attack: 6, hold: 0, release: 90, envCurve: 'exponential', pitchVar: 5, gainVar: 5 } ] },
  { name: 'Soft UI click', volume: 0.7, timeScale: 1, seqGap: 200, reverb: 0, layers: [
    { enabled: true, source: 'sine', gain: 0.5, delay: 0, freqStart: 1200, freqEnd: 800, rise: 1, sweepCurve: 'exponential',
      bandpass: false, q: 1, highpass: 20, lowpass: 4000, lowpassStages: 1,
      attack: 2, hold: 0, release: 40, envCurve: 'exponential', pitchVar: 3, gainVar: 5 },
    { enabled: true, source: 'white', gain: 0.15, delay: 0, freqStart: 4000, freqEnd: 4000, rise: 1, sweepCurve: 'exponential',
      bandpass: true, q: 1, highpass: 2000, lowpass: 8000, lowpassStages: 1,
      attack: 1, hold: 0, release: 15, envCurve: 'exponential', pitchVar: 0, gainVar: 10 } ] },
  { name: 'Whoosh', volume: 0.7, timeScale: 1, seqGap: 500, reverb: 0.2, layers: [
    { enabled: true, source: 'pink', gain: 0.6, delay: 0, freqStart: 400, freqEnd: 3000, rise: 1, sweepCurve: 'exponential',
      bandpass: true, q: 1.5, highpass: 150, lowpass: 8000, lowpassStages: 1,
      attack: 180, hold: 40, release: 220, envCurve: 'linear', pitchVar: 5, gainVar: 5 } ] },
  { name: 'Coin', volume: 0.6, timeScale: 1, seqGap: 300, reverb: 0.1, layers: [
    { enabled: true, source: 'square', gain: 0.25, delay: 0, freqStart: 988, freqEnd: 988, rise: 1, sweepCurve: 'exponential',
      bandpass: false, q: 1, highpass: 20, lowpass: 5000, lowpassStages: 1,
      attack: 2, hold: 60, release: 60, envCurve: 'exponential', pitchVar: 0, gainVar: 0 },
    { enabled: true, source: 'square', gain: 0.25, delay: 70, freqStart: 1319, freqEnd: 1319, rise: 1, sweepCurve: 'exponential',
      bandpass: false, q: 1, highpass: 20, lowpass: 5000, lowpassStages: 1,
      attack: 2, hold: 80, release: 250, envCurve: 'exponential', pitchVar: 0, gainVar: 0 } ] },
];

// ===================== audio engine =====================
// Used both live (AudioContext) and for rendering (OfflineAudioContext), so they always match.
const noiseCache = new WeakMap();
function noiseBuffer(ctx, type) {
  let byType = noiseCache.get(ctx);
  if (!byType) { byType = {}; noiseCache.set(ctx, byType); }
  if (byType[type]) return byType[type];
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (type === 'white') d[i] = w * 0.5;
    else if (type === 'pink') { b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .2; }
    else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }                     // brown
  }
  return (byType[type] = buf);
}
function reverbBuffer(ctx) {
  const len = Math.floor(ctx.sampleRate * 1.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++) { lp += (Math.random() * 2 - 1 - lp) * 0.3; d[i] = lp * Math.pow(1 - i / len, 2.5); } }
  return ir;
}
const layerLength = (L, ts) => (L.delay + (L.attack + L.hold + L.release) * ts) / 1000;
const soundLength = S => Math.max(0.01, ...S.layers.filter(l => l.enabled).map(l => layerLength(l, S.timeScale)));

function scheduleLayer(ctx, out, L, t0, ts, randomize) {
  const pv = randomize ? 1 + (Math.random() * 2 - 1) * L.pitchVar / 100 : 1;
  const gv = randomize ? 1 + (Math.random() * 2 - 1) * L.gainVar / 100 : 1;
  const a = L.attack * ts / 1000, h = L.hold * ts / 1000, r = L.release * ts / 1000;
  const t = t0 + L.delay / 1000, end = t + a + h + r;
  const f1 = L.freqStart * pv;
  let f2 = L.freqEnd * pv;
  if (f2 !== f1) f2 = f1 * Math.pow(f2 / f1, L.rise);                                // sweep strength
  const ramp = (param, from, to) => {
    param.setValueAtTime(from, t);
    if (to === from) return;
    if (L.sweepCurve === 'exponential') param.exponentialRampToValueAtTime(Math.max(1, to), end);
    else param.linearRampToValueAtTime(to, end);
  };

  let src, node;
  if (isNoise(L.source)) {
    src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx, L.source); src.loop = true;
  } else {
    src = ctx.createOscillator(); src.type = L.source; ramp(src.frequency, f1, f2);
  }
  node = src;
  if (L.highpass > 20) { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = L.highpass; f.Q.value = 0.5; node = node.connect(f); }
  if (L.bandpass) { const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = L.q; ramp(f.frequency, f1, f2); node = node.connect(f); }
  if (L.lowpass < 20000) for (let i = 0; i < L.lowpassStages; i++) {
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.5; f.frequency.value = L.lowpass * (1 + i * 0.1); node = node.connect(f);
  }
  const g = ctx.createGain(), peak = Math.max(0.0001, L.gain * gv);
  if (L.envCurve === 'exponential') {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + Math.max(a, 0.001));
    g.gain.setValueAtTime(peak, t + Math.max(a, 0.001) + h);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
  } else if (L.envCurve === 'eased') {
    const ta = Math.max(a, 0.002);
    g.gain.setValueAtTime(0, t);
    for (let i = 1; i <= 8; i++) g.gain.linearRampToValueAtTime(peak * (1 - Math.cos(Math.PI * i / 8)) / 2, t + ta * i / 8);
    g.gain.setValueAtTime(peak, t + ta + Math.max(h, 0.002));
    g.gain.linearRampToValueAtTime(0, end + Math.max(0, 0.002 - h));
  } else {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + Math.max(a, 0.001));
    g.gain.setValueAtTime(peak, t + Math.max(a, 0.001) + h);
    g.gain.linearRampToValueAtTime(0, end);
  }
  node.connect(g).connect(out);
  if (isNoise(L.source)) src.start(t, Math.random() * 1.5); else src.start(t);
  src.stop(end + 0.05);
}
function scheduleSound(ctx, dest, S, t0, randomize) {
  const master = ctx.createGain(); master.gain.value = S.volume; master.connect(dest);
  if (S.reverb > 0) {
    const cv = ctx.createConvolver(); cv.buffer = reverbBuffer(ctx);
    const wet = ctx.createGain(); wet.gain.value = S.reverb * 0.8;
    master.connect(cv).connect(wet).connect(dest);
  }
  for (const L of S.layers) if (L.enabled) scheduleLayer(ctx, master, L, t0, S.timeScale, randomize);
}

let actx = null, analyser = null;
function live() {
  if (!actx) { actx = new AudioContext(); analyser = actx.createAnalyser(); analyser.connect(actx.destination); }
  if (actx.state !== 'running') actx.resume();
  return actx;
}
function play() {
  const ctx = live(), n = $('sequence').checked ? 3 : 1;
  for (let i = 0; i < n; i++) scheduleSound(ctx, analyser, S, ctx.currentTime + 0.02 + i * S.seqGap / 1000, $('randomize').checked);
  flash($('play'));
}
async function render(randomize = false) {
  const sr = 44100, tail = S.reverb > 0 ? 1.2 : 0.05;
  const len = Math.ceil((soundLength(S) + tail) * sr);
  const ctx = new OfflineAudioContext(1, Math.max(len, 128), sr);
  scheduleSound(ctx, ctx.destination, S, 0, randomize);
  return ctx.startRendering();
}

// ===================== state, undo =====================
const $ = id => document.getElementById(id);
let S = structuredClone(BUILTINS[0]);
let currentKey = 'b:0';                   // which preset is selected ('b:i' built-in, 'm:name' mine)
const history = [], future = [];
let lastSnap = JSON.stringify(S);
function commit() {
  const snap = JSON.stringify(S);
  if (snap === lastSnap) return;
  history.push(lastSnap); if (history.length > 200) history.shift();
  future.length = 0; lastSnap = snap;
}
function restore(snap) { S = JSON.parse(snap); lastSnap = snap; buildUI(); changed(false); }
$('undo').onclick = () => { if (!history.length) return; future.push(lastSnap); restore(history.pop()); };
$('redo').onclick = () => { if (!future.length) return; history.push(lastSnap); restore(future.pop()); };

let playTimer = null, drawTimer = null;
function changed(autoplay = true) {
  commit();
  if (autoplay && $('autoplay').checked) { clearTimeout(playTimer); playTimer = setTimeout(play, 180); }
  clearTimeout(drawTimer); drawTimer = setTimeout(draw, 60);
  updateOut();
}

// ===================== UI: params =====================
const toSlider = (p, v) => p.log ? Math.log(v / p.min) / Math.log(p.max / p.min) * 1000 : v;
const fromSlider = (p, x) => {
  let v = p.log ? p.min * Math.pow(p.max / p.min, x / 1000) : +x;
  return p.step >= 1 ? Math.round(v / p.step) * p.step : +(Math.round(v / p.step) * p.step).toFixed(4);
};
const fmt = (p, v) => (p.step >= 1 ? Math.round(v) : +(+v).toFixed(p.step < 0.05 ? 2 : 2)) + (p.unit ? ' ' + p.unit : '');

function paramControl(p, obj, onChange) {
  const wrap = document.createElement('div');
  if (p.type === 'check') {
    wrap.className = 'param check';
    wrap.innerHTML = `<input type="checkbox"> <span>${p.label}</span>`;
    const cb = wrap.querySelector('input'); cb.checked = !!obj[p.key];
    cb.onchange = () => { obj[p.key] = cb.checked; onChange(); };
    return wrap;
  }
  wrap.className = 'param';
  if (p.type === 'select') {
    wrap.innerHTML = `<div class="top"><span>${p.label}</span></div><select>${p.options.map(o => `<option>${o}</option>`).join('')}</select>`;
    const sel = wrap.querySelector('select'); sel.value = obj[p.key];
    sel.onchange = () => { obj[p.key] = sel.value; onChange(true); };
    return wrap;
  }
  wrap.innerHTML = `<div class="top"><span>${p.label}</span><input class="val"></div><input type="range" min="${p.log ? 0 : p.min}" max="${p.log ? 1000 : p.max}" step="${p.log ? 1 : p.step}">`;
  const range = wrap.querySelector('input[type=range]'), val = wrap.querySelector('.val');
  const show = () => { range.value = toSlider(p, obj[p.key]); val.value = fmt(p, obj[p.key]); };
  range.oninput = () => { obj[p.key] = fromSlider(p, range.value); val.value = fmt(p, obj[p.key]); clearTimeout(drawTimer); drawTimer = setTimeout(draw, 60); updateOut(); };
  range.onchange = () => onChange();
  val.onchange = () => { const v = parseFloat(val.value); if (!isNaN(v)) obj[p.key] = Math.min(p.max, Math.max(p.min, v)); show(); onChange(); };
  val.onkeydown = e => { if (e.key === 'Enter') val.blur(); e.stopPropagation(); };
  range.ondblclick = () => { const d = (wrap.closest('.layer') ? defaultLayer() : defaultSound())[p.key]; if (d !== undefined) { obj[p.key] = d; show(); onChange(); } };
  show();
  return wrap;
}

function buildUI() {
  const m = $('master'); m.innerHTML = '';
  const title = document.createElement('div'); title.className = 'title';
  title.innerHTML = `<input id="soundName" spellcheck="false"><span class="hint">double-click a slider to reset it</span>`;
  m.appendChild(title);
  const nm = title.querySelector('input'); nm.value = S.name;
  nm.onchange = () => { S.name = nm.value.trim() || 'Untitled'; changed(false); };
  nm.onkeydown = e => e.stopPropagation();
  for (const p of MASTER_PARAMS) m.appendChild(paramControl(p, S, () => changed()));

  const box = $('layers'); box.innerHTML = '';
  S.layers.forEach((L, i) => {
    const el = document.createElement('div'); el.className = 'layer' + (L.enabled ? '' : ' off');
    el.innerHTML = `<div class="head">
        <label><input type="checkbox" ${L.enabled ? 'checked' : ''}> <span class="lname">Layer ${i + 1}</span></label>
        <span class="hint">${L.source}${isNoise(L.source) ? ' noise' : ' wave'}</span><span class="grow"></span>
        <button class="small solo">Solo ▶</button>
        <button class="small dup">Duplicate</button>
        <button class="small icon up" ${i ? '' : 'disabled'}>↑</button>
        <button class="small icon down" ${i < S.layers.length - 1 ? '' : 'disabled'}>↓</button>
        <button class="small icon del" ${S.layers.length > 1 ? '' : 'disabled'}>✕</button>
      </div><div class="groups"></div>`;
    const groups = el.querySelector('.groups');
    for (const g of LAYER_PARAMS) {
      const gEl = document.createElement('div'); gEl.className = 'group'; gEl.innerHTML = `<h3>${g.group}</h3>`;
      for (const p of g.items) gEl.appendChild(paramControl(p, L, rebuild => { if (rebuild) buildUI(); changed(); }));
      groups.appendChild(gEl);
    }
    el.querySelector('input[type=checkbox]').onchange = e => { L.enabled = e.target.checked; buildUI(); changed(); };
    el.querySelector('.solo').onclick = () => {
      const ctx = live(); const solo = { ...S, layers: [{ ...L, enabled: true }] };
      scheduleSound(ctx, analyser, solo, ctx.currentTime + 0.02, $('randomize').checked);
    };
    el.querySelector('.dup').onclick = () => { S.layers.splice(i + 1, 0, structuredClone(L)); buildUI(); changed(); };
    el.querySelector('.up').onclick = () => { [S.layers[i - 1], S.layers[i]] = [S.layers[i], S.layers[i - 1]]; buildUI(); changed(false); };
    el.querySelector('.down').onclick = () => { [S.layers[i + 1], S.layers[i]] = [S.layers[i], S.layers[i + 1]]; buildUI(); changed(false); };
    el.querySelector('.del').onclick = () => { S.layers.splice(i, 1); buildUI(); changed(); };
    box.appendChild(el);
  });
  $('addLayer').disabled = S.layers.length >= 4;
  buildPresets();
}
$('addLayer').onclick = () => { if (S.layers.length < 4) { S.layers.push(defaultLayer()); buildUI(); changed(); } };

// ===================== presets =====================
function loadMine() { try { return JSON.parse(localStorage.getItem('studio-sounds')) || {}; } catch { return {}; } }
function saveMine(m) { try { localStorage.setItem('studio-sounds', JSON.stringify(m)); } catch {} }
function buildPresets() {
  const b = $('builtins'); b.innerHTML = '';
  BUILTINS.forEach((p, i) => {
    const el = document.createElement('div'); el.className = 'preset' + (currentKey === 'b:' + i ? ' on' : '');
    el.innerHTML = `<span class="name"></span>`; el.querySelector('.name').textContent = p.name;
    el.onclick = () => { currentKey = 'b:' + i; S = structuredClone(p); buildUI(); changed(); };
    b.appendChild(el);
  });
  const mine = loadMine(), m = $('mine'); m.innerHTML = '';
  const names = Object.keys(mine).sort((a, z) => a.localeCompare(z));
  if (!names.length) m.innerHTML = '<p class="hint">Nothing saved yet.</p>';
  for (const name of names) {
    const el = document.createElement('div'); el.className = 'preset' + (currentKey === 'm:' + name ? ' on' : '');
    el.innerHTML = `<span class="name"></span><button class="small icon" title="Delete">✕</button>`;
    el.querySelector('.name').textContent = name;
    el.onclick = () => { currentKey = 'm:' + name; S = structuredClone(mine[name]); buildUI(); changed(); };
    el.querySelector('button').onclick = e => {
      e.stopPropagation();
      if (!confirm(`Delete "${name}"?`)) return;
      const all = loadMine(); delete all[name]; saveMine(all);
      if (currentKey === 'm:' + name) currentKey = '';
      buildPresets();
    };
    m.appendChild(el);
  }
}
function saveAs(name) {
  const all = loadMine(); S.name = name; all[name] = structuredClone(S); saveMine(all);
  currentKey = 'm:' + name; buildUI(); changed(false); toast('Saved "' + name + '"');
}
$('save').onclick = () => {
  if (currentKey.startsWith('m:')) saveAs(currentKey.slice(2));
  else $('saveAs').onclick();
};
$('saveAs').onclick = () => {
  const name = prompt('Save as:', S.name.replace(/ \(current\)$/, '')); if (!name) return;
  if (loadMine()[name] && !confirm(`Replace "${name}"?`)) return;
  saveAs(name.trim());
};
$('newSound').onclick = () => { currentKey = ''; S = defaultSound(); buildUI(); changed(); };

// ===================== visualisation =====================
function fft(re, im) {                      // in-place radix-2
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci, ai = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k + len / 2] = re[i + k] - ar; im[i + k + len / 2] = im[i + k] - ai; re[i + k] += ar; im[i + k] += ai;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } } }
}
function sizeCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  return cv.getContext('2d');
}
const heat = v => {                         // 0..1 -> dark blue / teal / amber / white
  const stops = [[12, 13, 15], [30, 60, 120], [40, 170, 190], [255, 181, 71], [255, 245, 220]];
  const x = Math.max(0, Math.min(1, v)) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
  return stops[i].map((c, k) => Math.round(c + (stops[i + 1][k] - c) * f));
};
async function draw() {
  const buf = await render(false), d = buf.getChannelData(0), sr = buf.sampleRate;
  // waveform
  const w = sizeCanvas($('wave')), W = w.canvas.width, H = w.canvas.height;
  w.fillStyle = '#0c0d0f'; w.fillRect(0, 0, W, H);
  w.strokeStyle = '#2e333a'; w.beginPath(); w.moveTo(0, H / 2); w.lineTo(W, H / 2); w.stroke();
  let peak = 0; for (const v of d) peak = Math.max(peak, Math.abs(v));
  const scale = peak > 0 ? (H / 2 - 4) / Math.max(peak, 0.05) : 1;
  w.fillStyle = '#ffb547';
  const per = d.length / W;
  for (let x = 0; x < W; x++) {
    let mn = 1, mx = -1; const s = Math.floor(x * per), e = Math.min(d.length, Math.floor((x + 1) * per) + 1);
    for (let i = s; i < e; i++) { if (d[i] < mn) mn = d[i]; if (d[i] > mx) mx = d[i]; }
    if (mx >= mn) w.fillRect(x, H / 2 - mx * scale, 1, Math.max(1, (mx - mn) * scale));
  }
  // spectrogram (log frequency axis 40 Hz - 16 kHz)
  const s = sizeCanvas($('spec')), SW = s.canvas.width, SH = s.canvas.height;
  const N = 1024, hop = Math.max(64, Math.floor(d.length / SW)), frames = Math.max(1, Math.floor((d.length - N) / hop) + 1);
  const img = s.createImageData(SW, SH), fMin = 40, fMax = 16000;
  const win = new Float32Array(N).map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
  const cols = [];
  let maxDb = -200, weighted = 0, total = 0;
  for (let f = 0; f < frames; f++) {
    const re = new Float32Array(N), im = new Float32Array(N);
    for (let i = 0; i < N; i++) re[i] = (d[f * hop + i] || 0) * win[i];
    fft(re, im);
    const mag = new Float32Array(N / 2);
    for (let k = 0; k < N / 2; k++) { const p = re[k] * re[k] + im[k] * im[k]; mag[k] = 10 * Math.log10(p + 1e-12);
      if (mag[k] > maxDb) maxDb = mag[k]; weighted += p * k * sr / N; total += p; }
    cols.push(mag);
  }
  for (let x = 0; x < SW; x++) {
    const mag = cols[Math.min(cols.length - 1, Math.floor(x / SW * cols.length))];
    for (let y = 0; y < SH; y++) {
      const freq = fMin * Math.pow(fMax / fMin, 1 - y / SH), k = Math.min(N / 2 - 1, Math.round(freq / sr * N));
      const v = (mag[k] - (maxDb - 70)) / 70, [r, g, b] = heat(v), o = (y * SW + x) * 4;
      img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
    }
  }
  s.putImageData(img, 0, 0);
  s.fillStyle = 'rgba(231,233,236,.55)'; s.font = `${11 * (devicePixelRatio || 1)}px ui-monospace, monospace`;
  for (const f of [100, 500, 1000, 2000, 5000, 10000]) {
    const y = SH * (1 - Math.log(f / fMin) / Math.log(fMax / fMin));
    s.fillRect(0, y, 6, 1); s.fillText(f >= 1000 ? f / 1000 + 'k' : f, 9, y + 4);
  }
  $('stLen').textContent = Math.round(soundLength(S) * 1000) + ' ms';
  $('stPeak').textContent = peak > 0 ? (20 * Math.log10(peak)).toFixed(1) + ' dB' : '–';
  $('stCentre').textContent = total > 0 ? Math.round(weighted / total) + ' Hz' : '–';
}
addEventListener('resize', () => { clearTimeout(drawTimer); drawTimer = setTimeout(draw, 100); });

// ===================== export =====================
function codeFor(S) {
  const layers = S.layers.filter(l => l.enabled).map(l => {
    const o = {}; for (const k of Object.keys(defaultLayer())) if (k !== 'enabled') o[k] = l[k]; return o;
  });
  return `// ${S.name} — made with Sound Studio
// Usage: const ctx = new AudioContext(); playSound(ctx, ctx.destination);
// (On iOS/Safari create or resume the AudioContext inside a tap/click handler first.)
const SOUND = ${JSON.stringify({ volume: S.volume, timeScale: S.timeScale, reverb: S.reverb, layers }, null, 1).replace(/\n\s*/g, ' ')};

function playSound(ctx, destination, when = ctx.currentTime, randomize = true) {
  const S = SOUND;
  const cache = playSound._noise || (playSound._noise = new WeakMap());
  const noise = type => {
    const per = cache.get(ctx) || {}; cache.set(ctx, per);
    if (per[type]) return per[type];
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (type === 'white') d[i] = w * 0.5;
      else if (type === 'pink') { b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .2; }
      else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
    }
    return (per[type] = buf);
  };
  const master = ctx.createGain(); master.gain.value = S.volume; master.connect(destination);
  if (S.reverb > 0) {
    const len = Math.floor(ctx.sampleRate * 1.2), ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); let lp = 0;
      for (let i = 0; i < len; i++) { lp += (Math.random() * 2 - 1 - lp) * 0.3; d[i] = lp * Math.pow(1 - i / len, 2.5); } }
    const cv = ctx.createConvolver(); cv.buffer = ir; const wet = ctx.createGain(); wet.gain.value = S.reverb * 0.8;
    master.connect(cv).connect(wet).connect(destination);
  }
  for (const L of S.layers) {
    const isNoise = ['pink', 'white', 'brown'].includes(L.source);
    const pv = randomize ? 1 + (Math.random() * 2 - 1) * L.pitchVar / 100 : 1;
    const gv = randomize ? 1 + (Math.random() * 2 - 1) * L.gainVar / 100 : 1;
    const a = L.attack * S.timeScale / 1000, h = L.hold * S.timeScale / 1000, r = L.release * S.timeScale / 1000;
    const t = when + L.delay / 1000, end = t + a + h + r;
    const f1 = L.freqStart * pv; let f2 = L.freqEnd * pv;
    if (f2 !== f1) f2 = f1 * Math.pow(f2 / f1, L.rise);
    const ramp = (p, from, to) => { p.setValueAtTime(from, t); if (to === from) return;
      if (L.sweepCurve === 'exponential') p.exponentialRampToValueAtTime(Math.max(1, to), end); else p.linearRampToValueAtTime(to, end); };
    let src;
    if (isNoise) { src = ctx.createBufferSource(); src.buffer = noise(L.source); src.loop = true; }
    else { src = ctx.createOscillator(); src.type = L.source; ramp(src.frequency, f1, f2); }
    let node = src;
    if (L.highpass > 20) { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = L.highpass; f.Q.value = 0.5; node = node.connect(f); }
    if (L.bandpass) { const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = L.q; ramp(f.frequency, f1, f2); node = node.connect(f); }
    if (L.lowpass < 20000) for (let i = 0; i < L.lowpassStages; i++) {
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.5; f.frequency.value = L.lowpass * (1 + i * 0.1); node = node.connect(f); }
    const g = ctx.createGain(), peak = Math.max(0.0001, L.gain * gv), ta = t + Math.max(a, 0.001);
    if (L.envCurve === 'exponential') {
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, ta);
      g.gain.setValueAtTime(peak, ta + h); g.gain.exponentialRampToValueAtTime(0.0001, end);
    } else if (L.envCurve === 'eased') {
      const ea = Math.max(a, 0.002);
      g.gain.setValueAtTime(0, t);
      for (let i = 1; i <= 8; i++) g.gain.linearRampToValueAtTime(peak * (1 - Math.cos(Math.PI * i / 8)) / 2, t + ea * i / 8);
      g.gain.setValueAtTime(peak, t + ea + Math.max(h, 0.002)); g.gain.linearRampToValueAtTime(0, end + Math.max(0, 0.002 - h));
    } else {
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, ta);
      g.gain.setValueAtTime(peak, ta + h); g.gain.linearRampToValueAtTime(0, end);
    }
    node.connect(g).connect(master);
    if (isNoise) src.start(t, Math.random() * 1.5); else src.start(t);
    src.stop(end + 0.05);
  }
}
`;
}
let outMode = 'code';
function updateOut() { $('out').value = outMode === 'code' ? codeFor(S) : JSON.stringify(S, null, 2); }
$('tabCode').onclick = () => { outMode = 'code'; $('tabCode').classList.add('on'); $('tabJson').classList.remove('on'); updateOut(); };
$('tabJson').onclick = () => { outMode = 'json'; $('tabJson').classList.add('on'); $('tabCode').classList.remove('on'); updateOut(); };
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast(what + ' copied'); }
  catch { $('out').value = text; $('out').select(); toast('Select-all done: press Ctrl+C'); }
}
$('copyCode').onclick = () => copy(codeFor(S), 'Code');
$('copyJson').onclick = () => copy(JSON.stringify(S, null, 2), 'JSON');
$('importJson').onclick = () => {
  try {
    const o = JSON.parse($('out').value);
    if (!o || !Array.isArray(o.layers) || !o.layers.length) throw 0;
    S = { ...defaultSound(), ...o, layers: o.layers.slice(0, 4).map(l => ({ ...defaultLayer(), ...l })) };
    currentKey = ''; buildUI(); changed(); toast('Imported');
  } catch { toast('That isn\'t Sound Studio JSON'); }
};
$('wav').onclick = async () => {
  const buf = await render($('randomize').checked), d = buf.getChannelData(0), sr = buf.sampleRate;
  const view = new DataView(new ArrayBuffer(44 + d.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); view.setUint32(4, 36 + d.length * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sr, true);
  view.setUint32(28, sr * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); str(36, 'data'); view.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i])) * 0x7fff, true);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([view], { type: 'audio/wav' }));
  a.download = (S.name || 'sound').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.wav';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ===================== misc =====================
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function flash(el) { el.style.filter = 'brightness(1.3)'; setTimeout(() => el.style.filter = '', 120); }
$('play').onclick = play;
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox';
  if (e.code === 'Space' && !typing) { e.preventDefault(); play(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); (e.shiftKey ? $('redo') : $('undo')).onclick(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); $('save').onclick(); }
});
for (const id of ['autoplay', 'sequence', 'randomize']) {
  try { const v = localStorage.getItem('studio-' + id); if (v !== null) $(id).checked = v === '1'; } catch {}
  $(id).onchange = () => { try { localStorage.setItem('studio-' + id, $(id).checked ? '1' : '0'); } catch {} };
}
buildUI(); updateOut(); draw();
</script>
</body>
